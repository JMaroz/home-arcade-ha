name: HomeArcade
version: 2.56.0
slug: cabinet_bridge
description: >-
  The premium retro gaming frontend for Home Assistant. Manage ROMs, browse
  systems, and launch games from your sidebar or TV.
url: https://github.com/JMaroz/HomeArcade-HA
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 5000
ingress_stream: true
ports:
  5000/tcp: 9876
ports_description:
  5000/tcp: Direct Web UI and streaming port (optional; Ingress is used by default)
map:
  - media:rw
  - share:rw
backup_exclude:
  - ejs_cache/**
  - cores/**
  - rom-storage/**
panel_icon: mdi:gamepad-variant
panel_title: HomeArcade
hassio_api: true
options:
  data_dir: /data
  rom_watch_dir: ''
  max_upload_mb: 8192
  steamgriddb_api_key: ''
schema:
  data_dir: str?
  rom_watch_dir: str?
  max_upload_mb: int(16,16384)
  steamgriddb_api_key: str?
